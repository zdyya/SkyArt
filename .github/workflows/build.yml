name: 打包 macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # gh release create 需要，默认 token 可能只读

jobs:
  build:
    # 只出 Apple 芯片包（2026-08-10 起）：业务同事已全部换到 M 芯片机器，而 Intel 包只能在
    # Intel 机器上打（PyInstaller 不能跨架构编译），现存唯一的 Intel 标签 macos-15-intel 是
    # 大型运行器、计费更高。要恢复双架构就在 matrix 里加回
    # `- arch: x64 / runner: macos-15-intel / pack: pack:x64`，本地打 Intel 包的
    # `npm run pack:x64` 一直留着没删。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            pack: pack
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 编译 Python 后端
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          # cryptography 只许装预编译轮子。放任它下源码现编的话，编出来的
          # _rust.abi3.so 链构建机的 OpenSSL，跟 PyInstaller 收进包的 libssl 对不上，
          # 装好的应用启动即崩，而打包过程一路绿灯——这种包比编译失败更难查。
          .venv/bin/pip install --only-binary=cryptography -r requirements.txt
          .venv/bin/pip install pyinstaller
          MACOSX_DEPLOYMENT_TARGET=13.0 .venv/bin/pyinstaller skyart-backend.spec

      - name: 复制后端产物
        run: cp -r backend/dist/skyart-backend electron-app/backend-bin-${{ matrix.arch }}

      - name: 关掉 Spotlight 索引
        # electron-builder 打完 DMG 要卸载挂载卷，macos-15-intel 上必然报
        # "couldn't eject - Resource busy"：Spotlight 一挂上卷就开始建索引，
        # 占着不放。arm64 的 macos-15 镜像没这毛病。
        run: sudo mdutil -a -i off || true

      - name: 安装前端依赖并打包 DMG
        # electron-builder 打完 DMG 要 hdiutil detach 卸载挂载卷，runner 上偶发
        # exit 16（卷还被占用）。它内部已经退避重试 6 次仍会失败，所以整步重来——
        # 换一次挂载点通常就过了。重试前清掉 dist 并强卸残留卷，否则下一次
        # electron-builder 会撞上同名产物。
        run: |
          cd electron-app
          npm ci
          for i in 1 2 3; do
            if npm run ${{ matrix.pack }}; then exit 0; fi
            echo "::warning::第 $i 次打包失败，清理后重试"
            rm -rf dist
            for v in /Volumes/SkyArt*; do [ -e "$v" ] && hdiutil detach "$v" -force || true; done
            sleep 10
          done
          echo "::error::打包连续 3 次失败"
          exit 1

      - name: 发布到 GitHub Release
        # 打 tag 时才发。DMG 直接从这台机器传上去，不再经由 artifact 中转——
        # 中转是双架构时代的做法（两个包汇总到一个发版作业），现在只出 arm64 一个包，
        # 中转只剩坏处：多一次 188MB 上传下载，还要占 Actions 产物配额
        # （2026-09-10 beta.9 就是卡在配额上，包打好了却发不出去）。
        # 重新打同一个 tag 时先删旧 Release，否则 create 会因已存在而失败。
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # actions/checkout 会把附注 tag 降级成指向 commit 的轻量 tag，
          # 不重新拉一次真实 tag 对象的话，%(contents) 读到的是最后一条 commit message
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git for-each-ref "refs/tags/${{ github.ref_name }}" --format='%(contents)' > changelog.txt
          cat changelog.txt
          gh release delete "${{ github.ref_name }}" -y || true
          gh release create "${{ github.ref_name }}" electron-app/dist/SkyArt-*.dmg \
            --title "SkyArt ${{ github.ref_name }}" \
            --notes-file changelog.txt

      - name: 发送飞书发版通知
        # beta 是内部版，打 tag 只为在 GitHub 上留一份 Release 和包，不进群。
        # 要给群里发 beta，本地跑 .github/scripts/notify_feishu_release.py，
        # 凭证在 ~/.config/feishu-doc-cli/.env。
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-beta') }}
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_KEYWORD: ${{ secrets.FEISHU_WEBHOOK_KEYWORD }}
        run: |
          ARGS=()
          for f in electron-app/dist/SkyArt-*.dmg; do ARGS+=(--dmg-path "$f"); done
          # 脚本卡片标题自带 [SkyArt] 前缀，这里只传版本号，避免 "[SkyArt] SkyArt v1.0.3" 重复
          python3 .github/scripts/notify_feishu_release.py \
            --title "${{ github.ref_name }}" \
            --changelog-file changelog.txt \
            "${ARGS[@]}"
