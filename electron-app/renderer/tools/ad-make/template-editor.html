<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成片模板 · 编辑</title>
<link rel="stylesheet" href="../../shared/liquid-lens.css">
<style>
:root{
  --bg:#f4f5f7; --bg2:#ffffff; --bg3:#eef0f1; --bg4:#e5e7e9;
  --border:#e0e2e5; --accent:#f97316; --accent2:#ea580c;
  --btn:#1f2328; --btn-h:#000000;
  --text:#191b1f; --text2:#565b63; --text3:#9298a1;
  /* 选中态动效统一：颜色 .18s，位移 .12s，滑块 .28s，都用同一条缓动 */
  --e:cubic-bezier(.22,1,.36,1); --t-color:.18s ease; --t-move:.12s cubic-bezier(.22,1,.36,1);
  --green:#059669; --red:#dc2626; --blue:#2563eb; --yellow:#d97706;
  /* 阴影总强度压到 1.0（liquid-lens.css 里的默认是 1.53）。那个默认值是给首页调的，
     一屏三四张大卡片，阴影重才有质感；工作页面板多，同样的重量叠起来读到的
     不是层次，是「元素很多」。只压工作页，浏览页保持默认。 */
  --sh:1.00;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:system-ui,"PingFang SC",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.hidden{display:none!important;}
.ic{flex-shrink:0;vertical-align:-2px;}

/* ── Topbar（78px 红绿灯留白 + drag/no-drag，遵守 AdMake 约定）── */
/* 顶栏玻璃：与列表页、编辑页同一套。这一页底下没有滚动内容穿过，看不到折射，只为长得一样。
   backdrop-filter 这条是兜底，liquid-glass.js 会用带 url() 的行内样式盖掉它。 */
/* position + z-index 不能省：顶栏带了 backdrop-filter 就自成层叠上下文，
   不抬高层级的话，DOM 里排在后面的 .body 会盖住顶栏里弹出的下拉菜单 */
.topbar{background:rgba(255,255,255,.42);backdrop-filter:blur(3px) saturate(135%) brightness(108%);border-bottom:1px solid rgba(224,226,229,.7);box-shadow:inset 0 1.4px 0 rgba(255,255,255,.9);height:52px;display:flex;align-items:center;padding:0 16px 0 78px;gap:12px;flex-shrink:0;position:relative;z-index:100;-webkit-app-region:drag;}
.logo{font-size:16px;font-weight:700;color:var(--text);-webkit-app-region:no-drag;}
.logo span{color:var(--text2);font-size:12px;font-weight:400;margin-left:5px;}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);-webkit-app-region:no-drag;}
.breadcrumb a{color:var(--text2);cursor:pointer;text-decoration:none;}
.breadcrumb a:hover{color:var(--accent);}
.breadcrumb .sep{color:var(--text3);}
.breadcrumb .cur{font-weight:600;color:var(--text);}
.tb-name{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:13px;font-weight:600;width:240px;outline:none;-webkit-app-region:no-drag;}
/* 宽度跟着触发它的按钮组走：写死 150px 的话，菜单比按钮宽出一大截，
   看着像从一个小按钮里掉出个大盒子 */
.save-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--bg2);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:300;min-width:100%;white-space:nowrap;overflow:hidden;}
.save-menu.hidden{display:none;}
.save-menu a{display:block;padding:8px 14px;font-size:12px;cursor:pointer;color:var(--text);white-space:nowrap;}
.save-menu a:hover{background:var(--bg3);}
.tb-name:focus{border-color:var(--accent);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;-webkit-app-region:no-drag;}

.btn{padding:6px 14px;border-radius:6px;border:1px solid transparent;cursor:pointer;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:all .15s;}
.btn-primary{background:var(--btn);color:#fff;}.btn-primary:hover{background:var(--btn-h);}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border);}.btn-secondary:hover{background:var(--bg4);}
.btn-ghost{background:transparent;color:var(--text2);}.btn-ghost:hover{background:var(--bg3);}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
/* 开关按钮（选中态规范 C 类，跟编辑页的打点按钮同一套）：关着是凹的，开了浮起来变橙。
   翻转是个开关，原来靠把文字从「水平翻转」改成「取消翻转」来表示已经开了——
   状态藏在文案里，得先读完字才知道现在是什么样。 */
.btn-toggle{box-shadow:inset 0 2px 4px rgba(16,24,40,.12),inset 0 -1px 0 rgba(255,255,255,.7);
  transition:background var(--t-color),border-color var(--t-color),color var(--t-color),
             transform var(--t-move),box-shadow var(--t-move);}
.btn-toggle:not(.on):active{transform:translateY(1px);
  box-shadow:inset 0 3px 6px rgba(16,24,40,.18),inset 0 -1px 0 rgba(255,255,255,.5);}
.btn-toggle.on{background:var(--accent);color:#fff;border-color:var(--accent2);
  box-shadow:0 0 0 3px rgba(249,115,22,.22),0 6px 14px -4px rgba(234,88,12,.5);
  transform:translateY(-1px);}
.btn-toggle.on:hover{background:var(--accent2);}
/* 撤销/重做：跟左右两边的下拉用同一套描边控件，并成一组。
   原来是没有边框的透明图标，夹在两个描边下拉中间像两个漏画的图标。 */
.ic-pair{display:inline-flex;}
.ic-pair .btn{padding:0;width:24px;height:24px;justify-content:center;border-radius:0;
  background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.ic-pair .btn:hover:not(:disabled){background:var(--bg4);color:var(--text);}
.ic-pair .btn:first-child{border-radius:6px 0 0 6px;}
.ic-pair .btn:last-child{border-radius:0 6px 6px 0;margin-left:-1px;}

/* 三栏都是卡片，跟编辑页同一套：12px 外边距、10px 圆角、1px 边框，浮在灰底上。
   贴边直角的通栏面板和卡片混在一屏里，看着像有一半没做完。 */
.body{flex:1;min-height:0;display:flex;overflow:hidden;padding:12px;gap:12px;background:var(--bg);}
.col{display:flex;flex-direction:column;overflow:hidden;border-radius:14px;
       /* 工作面不写 backdrop-filter：底色 88% 不透明，滤镜本来就看不见，白开一层合成层 */
  background:rgba(255,255,255,var(--glass-work));
     box-shadow:0 0 0 1px rgba(24,28,36,calc(.055*var(--sh))),
                0 1px 1px rgba(24,28,36,calc(.10*var(--sh))),
                0 3px 5px rgba(24,28,36,calc(.09*var(--sh))),
                0 9px 18px rgba(24,28,36,calc(.10*var(--sh)));}
.col > *:not(.prism){position:relative;z-index:1;}
.col-config{width:300px;flex-shrink:0;}
.col-preview{flex:1;min-width:0;}
.col-prop{width:290px;flex-shrink:0;}
/* 列头挪进滚动容器里做 sticky：内容从它底下滚过去，边缘会把行掰弯。
   留在滚动容器外面是看不到这个效果的——两者不重叠就没有可折射的内容。
   内边距因此从 .col-scroll 挪到 .col-pad，列头才能通栏。 */
/* 列头自己要带圆角：它挂了 backdrop-filter 成了合成层，Chrome 不保证用祖先的
   border-radius 去裁合成层，不写这一条圆角面板里会露出一个方角 */
.col-head{border-radius:14px 14px 0 0;position:sticky;top:0;z-index:5;padding:11px 14px;font-size:12px;font-weight:700;
  color:var(--text2);border-bottom:1px solid rgba(224,226,229,.85);
/* 列头的底色必须比它所在的面板更实，不能更透。之前是 50% 白压在 88% 白的面板上，
   里外反过来，中间就显出一条灰带。这里给 .96，读起来是「一条页眉」而不是「一扇窗」。
   工作面上的列头不上镜片：折射被面板底色盖住看不见，只剩圆角处那个畸变的结。 */
  background:rgba(252,253,254,.96);
  box-shadow:inset 0 1.2px 0 rgba(255,255,255,.95);}
.col-scroll{flex:1;overflow-y:auto;}
.col-pad{padding:12px 14px;}

.sec{margin-bottom:15px;}
.sec-h{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;}
.sec-h .cnt{color:var(--text3);font-weight:400;margin-left:4px;}
.sec-h .add{margin-left:auto;font-size:11px;color:var(--accent);cursor:pointer;font-weight:600;}
.sec-h .add:hover{text-decoration:underline;}
.info-ic{cursor:help;color:var(--text3);margin-left:4px;display:inline-flex;align-items:center;position:relative;}
.info-ic:hover{color:var(--text2);}
/* 气泡 fixed 挂在视口上：左栏 overflow:hidden 会把挂在图标上的气泡沿栏边裁断 */
/* 素材导入进度：就地长在槽位/列表里，不遮挡别的操作。
   橙条灰底跟 AI 分析那套一致；服务端处理阶段没有百分比，改成一小段来回滑，
   表示在动但不谎报进度。 */
.slot.loading,.chip.loading{cursor:default;padding:9px 11px;display:block;}
.up-row .up-name{font-size:11px;font-weight:600;color:var(--text);margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.up-bar{height:4px;background:var(--bg4);border-radius:999px;overflow:hidden;margin-bottom:5px;}
.up-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .2s ease;}
.up-bar.indet i{width:40%!important;animation:upSlide 1.1s ease-in-out infinite;}
@keyframes upSlide{0%{margin-left:-40%}100%{margin-left:100%}}
.up-stage{font-size:10px;color:var(--text2);font-variant-numeric:tabular-nums;}
#tip-pop{position:fixed;z-index:9500;display:none;background:rgba(25,27,31,.94);color:#fff;
  padding:7px 10px;border-radius:6px;font-size:11px;font-weight:400;line-height:1.65;
  width:max-content;max-width:230px;white-space:pre-line;pointer-events:none;
  box-shadow:0 4px 14px rgba(0,0,0,.22);}
#tip-pop::before{content:"";position:absolute;left:-4px;top:50%;transform:translateY(-50%) rotate(45deg);
  width:8px;height:8px;background:rgba(25,27,31,.94);}
/* 片头/片尾模式：叠加内容区（文字/贴纸）整套只读，前后贴片与转场保持可用 */
/* 片头/片尾模式下三个叠加区置灰。pointer-events 只关掉子元素，区块本身还要接得住点击——
   整块关掉的话点上去毫无反应，addText 里那句「切回中段再编辑」永远触发不到，
   用户只看到一片点不动的东西，不知道是坏了还是被禁了。 */
.clips-mode .sec:has(#text-chips),.clips-mode .sec:has(#png-chips),.clips-mode .sec:has(#dyn-chips){
  opacity:.45;cursor:not-allowed;}
.clips-mode .sec:has(#text-chips) > *,.clips-mode .sec:has(#png-chips) > *,.clips-mode .sec:has(#dyn-chips) > *{
  pointer-events:none;}

.slot{border:1.5px dashed var(--border);border-radius:6px;padding:10px;text-align:center;cursor:pointer;background:var(--bg3);margin-bottom:7px;transition:all .15s;}
.slot:hover{border-color:var(--accent);background:rgba(249,115,22,.04);}
.slot.filled{border-style:solid;border-color:var(--green);background:rgba(5,150,105,.05);text-align:left;display:flex;align-items:center;gap:8px;}
.slot .s-ic{font-size:16px;}.slot .s-main{font-size:11px;font-weight:600;word-break:break-all;}.slot .s-sub{font-size:9px;color:var(--text3);margin-top:2px;}
.slot.filled .s-body{flex:1;min-width:0;}
.slot .s-x{color:var(--text3);cursor:pointer;font-size:13px;padding:1px 5px;border-radius:4px;flex-shrink:0;}
.slot .s-x:hover{background:rgba(220,38,38,.1);color:var(--red);}

/* B 类块形态：左侧橙条从左边滑出来，跟编辑页的 Part 列表、导出多选同一套语言 */
.chip{position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);margin-bottom:6px;cursor:pointer;overflow:hidden;transition:background var(--t-color),border-color var(--t-color);}
.chip:not(.sel):hover{border-color:var(--text3);background:var(--bg4);}
.chip::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform var(--t-move);}
.chip.sel{border-color:var(--accent);background:rgba(249,115,22,.07);}
.chip.sel::before{transform:scaleX(1);}
/* 共用额度只说一次，放两栏下面。原来两栏各写一个 n/3，看着像各有各的三层。 */
#bind-btn.on{background:rgba(249,115,22,.12);border-color:var(--accent);color:var(--accent2);}
.bind-note{font-size:10px;color:var(--text3);white-space:nowrap;}
#bind-btn{white-space:nowrap;}
.chip-ic{width:26px;height:26px;border-radius:6px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden;}
.chip-ic img,.chip-ic video{width:100%;height:100%;object-fit:contain;}
.chip-body{flex:1;min-width:0;}
.chip-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip-val{font-size:10px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip-x{color:var(--text3);cursor:pointer;font-size:12px;}.chip-x:hover{color:var(--red);}

.input{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 9px;font-size:12px;width:100%;outline:none;transition:border-color .15s;}
.input:focus{border-color:var(--accent);}
select.input{cursor:pointer;}
.field{margin-bottom:11px;}
.field-label{font-size:10px;color:var(--text3);margin-bottom:4px;font-weight:600;}

/* A 类分段控件（衔接转场）：凹槽实色，滑块浮起，滑块本体样式在 ui-kit.js */
.seg{position:relative;display:flex;padding:3px;border-radius:10px;
     background:rgba(20,24,30,.055);box-shadow:inset 0 1px 2px rgba(20,24,30,.1);}
.seg label{position:relative;z-index:1;flex:1;border-radius:6px;padding:6px 3px;text-align:center;
     font-size:11px;font-weight:500;cursor:pointer;color:var(--text2);
     transition:color var(--t-color);}
.seg input{display:none;}
.seg label:not(.on):hover{color:var(--text);}
.seg label.on{color:var(--text);font-weight:600;}
.seg .t-sub{display:block;font-size:8px;color:var(--text3);font-weight:400;margin-top:1px;}

.var-bar{display:flex;gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap;}
.var-chip{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:rgba(37,99,235,.1);color:var(--blue);border:1px solid rgba(37,99,235,.25);cursor:pointer;}
.var-chip:hover{background:rgba(37,99,235,.2);}
.mini-btns{display:flex;gap:6px;}.mini-btns .btn{flex:1;justify-content:center;}
.prop-empty{color:var(--text3);font-size:12px;text-align:center;padding:40px 10px;line-height:1.7;}

.prev-head{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--bg2);flex-wrap:wrap;}
.prev-head .lbl{font-size:11px;color:var(--text3);}
.prev-head select{font-size:11px;padding:4px 8px;}
.prev-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:auto;padding:20px;background:var(--bg3);position:relative;}
/* 返回：折角+来处文字，常驻大热区（返回是高频操作，不藏图标里） */
.bk{border:none;background:transparent;cursor:pointer;display:flex;align-items:center;gap:4px;color:var(--text2);font-size:13px;font-weight:500;padding:6px 12px 6px 6px;border-radius:6px;transition:color .15s,background .15s;}
.bk:hover{color:var(--text);background:var(--bg3);}
/* 保存双保险：改动时保存钮亮橙点 + 画布下浮出保存条，保存后自动收走 */
#save-btn{position:relative;}
#save-dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg2);display:none;}
body.dirty #save-dot{display:block;}
#savebar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%) translateY(70px);z-index:20;display:flex;align-items:center;gap:12px;background:var(--btn);color:#fff;padding:8px 9px 8px 16px;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.3);font-size:12.5px;opacity:0;transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .25s;pointer-events:none;white-space:nowrap;}
body.dirty #savebar{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto;}
#savebar .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
#savebar .b-save{background:var(--accent);color:#1a0d02;border:none;padding:6px 15px;border-radius:14px;font-weight:700;font-size:12px;cursor:pointer;}
#savebar .kbd{font-family:ui-monospace,Menlo,monospace;font-size:10px;background:rgba(0,0,0,.14);border-radius:4px;padding:1px 5px;margin-left:5px;}
.hint{font-size:11px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:5px 14px;}
.hint b{color:var(--accent);}
.canvas-fit{position:relative;flex-shrink:0;}
/* 画布内部坐标恒为 300×533——贴纸尺寸、文字安全宽度都按这个基准算，与导出的 720 宽等比。
   放大靠外层 transform，内部一个数都不用改；拖拽和缩放走的是 getBoundingClientRect
   归一化的百分比与比值，跟画布实际像素无关，所以缩放不影响交互。 */
.canvas{width:300px;height:533px;border-radius:14px;position:absolute;top:0;left:0;transform-origin:top left;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.18);background-size:cover;user-select:none;}
.strip{position:absolute;left:0;right:0;height:26px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:rgba(255,255,255,.92);background:rgba(0,0,0,.45);z-index:6;pointer-events:none;}
.strip.pre{top:0;}.strip.post{bottom:0;}
.film{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.28);font-size:12px;pointer-events:none;}
/* 垫了样例视频就不用再提示"这里是正片画面"——画面自己就在那儿，字压在上面像水印 */
.canvas:has(.sample-bg) .film{display:none;}
.flash{position:absolute;inset:0;background:#fff;z-index:9;pointer-events:none;opacity:0;}
.layer{position:absolute;z-index:4;cursor:grab;}
.layer.dragging{cursor:grabbing;}
.layer .inner{position:relative;}
.lyr-name{font-family:Georgia,"Songti SC",serif;font-weight:800;color:#ffd700;font-size:21px;text-shadow:0 2px 4px rgba(0,0,0,.7),0 0 2px #7a4b00;white-space:nowrap;}
.lyr-sell{font-size:13px;font-weight:800;color:#fff;background:var(--red);padding:3px 11px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.4);white-space:nowrap;}
.lyr-plain{font-size:14px;font-weight:700;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.7);white-space:nowrap;}
/* 宽度由 JS 按「原图像素 ÷ 720 成片宽」等比设置（所见即所得），不设固定上限 */
.lyr-png img{display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));pointer-events:none;}
.lyr-dyn{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:rgba(37,99,235,.35);border:1.5px dashed rgba(255,255,255,.8);border-radius:6px;pointer-events:none;}
.lyr-media{display:block;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.layer.sel .inner{outline:1.5px solid var(--accent);outline-offset:4px;}
.handle{position:absolute;width:18px;height:18px;background:#fff;border:2px solid var(--accent);z-index:5;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:var(--accent);user-select:none;}
/* 缩放：右下角方块（角落方块=改大小，同剪映） */
.h-scale{right:-13px;bottom:-13px;border-radius:4px;cursor:nwse-resize;}
/* 旋转：元素上方圆形 + rotate-cw 图标，带连接杆 */
.h-rot{left:50%;top:-34px;transform:translateX(-50%);border-radius:50%;cursor:grab;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>');background-repeat:no-repeat;background-position:center;background-size:10px 10px;}
.h-rot:after{content:"";position:absolute;left:50%;top:16px;width:1px;height:16px;background:var(--accent);transform:translateX(-50%);}
/* 元素靠画布顶部时手柄翻到下方（否则伸出画布被裁掉、够不着） */
.h-rot.below{top:auto;bottom:-34px;}
.h-rot.below:after{top:auto;bottom:16px;}
.layer.full{inset:0;cursor:pointer;display:flex;align-items:flex-start;justify-content:center;}
.layer.full.sel{outline:1.5px dashed var(--blue);outline-offset:-2px;}
.dyn-badge{margin-top:130px;font-size:11px;color:#fff;background:rgba(37,99,235,.85);padding:4px 10px;border-radius:999px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.guide{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .2s;}
.guide.on{opacity:1;}
.guide::before{content:"";position:absolute;left:33.33%;right:33.33%;top:0;bottom:0;border-left:1px dashed rgba(249,115,22,.5);border-right:1px dashed rgba(249,115,22,.5);}
.guide::after{content:"";position:absolute;top:33.33%;bottom:33.33%;left:0;right:0;border-top:1px dashed rgba(249,115,22,.5);border-bottom:1px dashed rgba(249,115,22,.5);}
.prev-foot{font-size:11px;color:var(--text3);text-align:center;}.prev-foot b{color:var(--blue);}
.note{font-size:9.5px;color:var(--text3);line-height:1.55;margin-top:6px;background:var(--bg3);border-radius:6px;padding:7px 9px;}
.note b{color:var(--text2);}
.ok{color:var(--green);font-weight:700;}
.p1{font-size:8px;font-weight:600;padding:1px 4px;border-radius:6px;background:rgba(37,99,235,.12);color:var(--blue);margin-left:3px;}

/* 通知在顶栏正中（栏中间是空位,不遮控件） */
#toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;}
/* 返回确认弹窗：主按钮=保存并返回（引导保存），丢弃是次要样式 */
#leave-modal{position:fixed;inset:0;z-index:9000;background:rgba(15,17,20,.45);display:flex;align-items:center;justify-content:center;}
/* 弹窗＝实色卡片 + 一圈玻璃边。中间实心，正文对比度不受影响；只有外圈那一环折射被遮罩压暗的页面。
   通体做玻璃行不通：白玻璃叠在 45% 黑遮罩上混成一片灰浆，字跟着糊。 */
.leave-glass{padding:4px;border-radius:14px;display:flex;
  background:rgba(255,255,255,.2);
  backdrop-filter:blur(4px) saturate(150%) brightness(112%);
  box-shadow:inset 0 1.2px 0 rgba(255,255,255,.85),
             inset 0 -1px 0 rgba(255,255,255,.25),
             0 20px 56px rgba(10,13,18,.34),0 4px 12px rgba(10,13,18,.18);
  /* 玻璃边不吃点击：点这一圈仍然穿透到遮罩，保持"点空白处关闭"的原行为 */
  pointer-events:none;}
.leave-glass > *{pointer-events:auto;}
.leave-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:20px 22px;width:340px;}
.leave-card h3{font-size:14.5px;margin:0 0 6px;color:var(--text);}
.leave-card p{font-size:12.5px;color:var(--text2);margin:0 0 16px;line-height:1.7;}
.leave-card .row{display:flex;gap:8px;justify-content:flex-end;}
.leave-card .btn-discard{background:transparent;color:var(--red,#dc2626);border:1px solid var(--border);}
.leave-card .btn-discard:hover{background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.4);}
.toast{background:#1f2328;color:#fff;border-radius:999px;padding:9px 18px 9px 12px;font-size:12.5px;font-weight:500;max-width:min(46vw,480px);animation:dropIn .25s ease;display:flex;align-items:center;gap:9px;box-shadow:0 10px 30px rgba(15,18,22,.28),0 2px 6px rgba(15,18,22,.16);}
.toast-dot{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;}
.toast-dot svg{width:10px;height:10px;stroke:#1f2328;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.toast-success .toast-dot{background:#34d399;}
.toast-error .toast-dot{background:#fb7185;}
.toast-info .toast-dot{background:#60a5fa;}
@keyframes dropIn{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-thumb{background:#c6c9cd;border-radius:3px;}

<script>
const _PORT = (window.electronAPI && window.electronAPI.backendPort) || 8764;
const API = `http://127.0.0.1:${_PORT}/api/v1`;
const ORIGIN = `http://127.0.0.1:${_PORT}`;
let authToken = localStorage.getItem('skyart_token') || '';
const TID = Number(new URLSearchParams(location.search).get('templateId'));
// 从哪张列表进来的就回哪张。丢了 kind，2.0 的人会被送回老路那张空列表。
const _KIND = new URLSearchParams(location.search).get('kind') === 'segments' ? 'kind=segments' : '';
const _KQ = (sep) => (_KIND ? (sep || '?') + _KIND : '');

// 模板配置（前端权威状态，保存时 PUT 整个 config）
// 静态贴纸和动态贴纸各自的张数上限，两边独立不共用。贴多了画面就乱了
const STICKER_MAX = 3;
let cfg = { intro: null, outro: null, texts: [], pngs: [], dyns: [], transition: 'white' };
let selected = null;      // 选中元素 id
let sampleProjects = [];  // 样例项目（供 {剧名} 预览）
let frameIdx = 1;  // 默认预览中段（正片）——贴纸/文字只在正片生效
const FRAMES = ['linear-gradient(160deg,#1a1c3a,#3a2145)','linear-gradient(160deg,#2a1e3a,#463050)','linear-gradient(160deg,#0f2233,#233a45)'];
// 预览用的字体/颜色近似（真字体在导出时由 Pillow 用系统字体渲染）
const FONT_CSS = {
  '宋体':"'Songti SC',serif", '黑体':"'Heiti SC','PingFang SC',sans-serif", '圆润体':"'Hiragino Sans GB','PingFang SC',sans-serif",
  'Anton':"'Anton','Arial Black',sans-serif", 'Bebas':"'Bebas Neue','Oswald',sans-serif",
  'Poppins':"'Poppins','Helvetica Neue',sans-serif", 'Alfa Slab':"'Alfa Slab One','Rockwell',serif",
  'Bangers':"'Bangers','Comic Sans MS',cursive", 'Lobster':"'Lobster','Snell Roundhand',cursive",
  'Pacifico':"'Pacifico','Snell Roundhand',cursive", 'Playfair':"'Playfair Display',Georgia,serif",
};
const CN_FONTS = ['宋体','黑体','圆润体'];
const EN_FONTS = ['Anton','Bebas','Poppins','Alfa Slab','Bangers','Lobster','Pacifico','Playfair'];
// 立体金属特效的预览近似（导出由后端 Pillow 精渲，这里 CSS 近似做 WYSIWYG）
function mixHex(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [ar, ag, ab] = p(a), [br, bg, bb] = p(b);
  const c = v => ('0' + Math.round(v).toString(16)).slice(-2);
  return '#' + c(ar + (br - ar) * t) + c(ag + (bg - ag) * t) + c(ab + (bb - ab) * t);
}
function bevelCss(hex) {
  // 参数对齐后端 _ramp/_render_bevel 新配方：高光带压到上 35%、细描边、短挤出+轻投影
  const light = mixHex(hex, '#ffffff', 0.75), deep = mixHex(hex, '#000000', 0.58),
        extr = mixHex(hex, '#000000', 0.5), out = mixHex(hex, '#000000', 0.8);
  return `background:linear-gradient(180deg,${light},${hex} 35%,${deep});-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;-webkit-text-stroke:0.8px ${out};text-shadow:1px 1px ${extr},1.6px 1.6px ${extr},0 2.5px 2px rgba(0,0,0,.35);`;
}
// @font-face 加载海外字体(后端 /fonts 提供),让预览所见即所得
const _FONT_FILES = { 'Anton':['Anton','Anton.ttf'], 'Bebas':['Bebas Neue','BebasNeue.ttf'], 'Poppins':['Poppins','Poppins.ttf'],
  'Alfa Slab':['Alfa Slab One','AlfaSlab.ttf'], 'Bangers':['Bangers','Bangers.ttf'], 'Lobster':['Lobster','Lobster.ttf'],
  'Pacifico':['Pacifico','Pacifico.ttf'], 'Playfair':['Playfair Display','PlayfairDisplay.ttf'] };
function loadFonts() {
  const css = EN_FONTS.map(k => { const [fam, file] = _FONT_FILES[k];
    return `@font-face{font-family:'${fam}';src:url('${ORIGIN}/fonts/${file}');font-display:swap;}`; }).join('');
  const s = document.createElement('style'); s.textContent = css; document.head.appendChild(s);
}
const COLOR_CSS = { '金':'#ffd700', '白':'#ffffff', '红':'#e11d2a', '粉':'#ff78aa', '蓝':'#3c8cff', '黑':'#141414' };

// ── API ──
async function apiFetch(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401) { localStorage.removeItem('skyart_token'); location.href = '../../home.html'; throw new Error('未授权'); }
  if (!res.ok) throw new Error(await res.text().catch(() => res.statusText));
  return res.status === 204 ? null : res.json();
}
// 用 XHR 不用 fetch：fetch 没法report上传进度。贴片动辄几十上百 MB，
// 传的时候没有任何动静，用户不知道是在传还是卡住了。
// 上传完还有服务端那段（校验、透明通道检测、贴片归一化转码），那一段拿不到百分比，
// 只能如实说"正在处理"，不编一个假的进度条。
function apiUploadAsset(kind, file, onProgress) {
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append('kind', kind);
    fd.append('file', file);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${API}/admake/templates/${TID}/assets`);
    if (authToken) xhr.setRequestHeader('Authorization', `Bearer ${authToken}`);
    xhr.upload.onprogress = e => {
      if (!onProgress) return;
      if (e.lengthComputable) onProgress('uploading', Math.round(e.loaded / e.total * 100));
    };
    // 上传完到响应回来之间是服务端在干活，切成不确定态
    xhr.upload.onload = () => onProgress && onProgress('processing', 100);
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch { reject(new Error('返回内容无法解析')); }
        return;
      }
      let msg = xhr.statusText;
      try { msg = JSON.parse(xhr.responseText).detail || msg; } catch {}
      reject(new Error(msg));
    };
    xhr.onerror = () => reject(new Error('网络中断'));
    xhr.ontimeout = () => reject(new Error('上传超时'));
    xhr.send(fd);
  });
}
function assetUrl(asset) { return `${ORIGIN}/uploads/AdMake/Templates/template_${TID}/${asset}`; }

// ── 载入 ──
let _loadFailed = false;  // 载入失败必须锁死保存——否则空画布一保存就把线上模板洗成空的
async function init() {
  if (!authToken || !TID) { location.href = 'index.html' + _KQ(''); return; }
  loadFonts();
  try {
    const t = await apiFetch(`/admake/templates/${TID}`);
    document.getElementById('tpl-name').value = t.name || '';
    cfg = Object.assign({ intro: null, outro: null, texts: [], pngs: [], dyns: [], transition: 'white' }, t.config || {});
    cfg.texts = cfg.texts || []; cfg.pngs = cfg.pngs || []; cfg.dyns = cfg.dyns || [];
    // 老模板存的时候还没有「衔接转场」这个字段，值是空的。Object.assign 会拿这个空值
    // 盖掉上面的默认档，结果打开就落在「无」上。空值一律回到快闪白；用户主动选的「无」
    // 存下来是 'none' 这个字符串，不会被这行改掉。
    if (!cfg.transition) cfg.transition = 'white';
  } catch (e) {
    _loadFailed = true;
    document.getElementById('save-btn').disabled = true;
    toast('载入模板失败：' + e.message + '。已禁用保存，请返回后重进', 'error', 8000);
  }
  try {
    // 爆款素材不在这个列表里。那一类的每个项目是一条已经投放过的广告片，
    // 传进来只为拆段分析，不会经过出片这一步，成片模板对它没有落脚的地方。
    // 留在列表里的话，旁边那颗「用于该项目」能把模板绑上去，绑完永远不生效，
    // 界面上也不会说它没生效。
    const 全部 = await apiFetch('/admake/projects');
    sampleProjects = (全部 || []).filter(p => p.project_kind !== 'hot');
  } catch (e) { sampleProjects = []; }
  try { sampleTemplates = await apiFetch('/admake/templates'); } catch { sampleTemplates = []; }
  const sel = document.getElementById('sample-sel');
  sel.innerHTML = sampleProjects.length
    ? sampleProjects.map(p => `<option value="${p.id}">${esc(p.title)}</option>`).join('')
    : '<option value="">（还没有能出片的项目）</option>';
  renderBindBtn();
  renderAll();
  // 载入完成后建立历史基线：撤销到不了比初始更早，未保存判断以此为准
  _hist = [_snap()]; _histPos = 0; _savedSnap = _hist[0];
  _updateUndoBtns();
  _updateDirtyUI();
  // 名称改动不进历史（撤销不回滚名字），但要点亮未保存提示
  document.getElementById('tpl-name').addEventListener('input', _updateDirtyUI);
  // 海外字体是异步 @font-face 加载的，首次渲染用退底字体测宽会算错缩放/换行；
  // 字体就绪后重渲一次，让 fitText 用真实字形宽度（与导出对齐）
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderPreview());
}

// ── 撤销/重做 + 未保存检测 ──
let _hist = [], _histPos = -1, _restoring = false, _histTimer = null;
let _savedSnap = '';  // 上次保存（或初始载入）时的快照
function _snap() { return JSON.stringify({ cfg, name: document.getElementById('tpl-name').value }); }
function _commitHist() {
  const s = _snap();
  if (_hist[_histPos] === s) return;
  _hist = _hist.slice(0, _histPos + 1);
  _hist.push(s);
  if (_hist.length > 50) _hist.shift();
  _histPos = _hist.length - 1;
  _updateUndoBtns();
  _updateDirtyUI();
}
// 未保存状态可视化：保存钮亮橙点 + 画布下浮出保存条（保存/撤回到基线后自动收走）
function _updateDirtyUI() {
  document.body.classList.toggle('dirty', !!_savedSnap && _snap() !== _savedSnap);
}
function _pushHist() {
  if (_restoring || _histPos < 0) return;
  clearTimeout(_histTimer);
  // 300ms 合并：连续拖动/连续敲字算一步，撤销不至于一次退一像素
  _histTimer = setTimeout(_commitHist, 300);
}
function _restore(s) {
  _restoring = true;
  const d = JSON.parse(s);
  cfg = d.cfg;
  // 名称不随撤销回滚：改名没有独立的历史步，回滚会让"撤销一次拖动"顺带吞掉改名。
  // 名称仍在快照里，供未保存检测用。
  selected = null;
  renderAll();
  _restoring = false;
  _updateUndoBtns();
  _updateDirtyUI();  // 撤回到保存基线时收走未保存提示
}
function undoEdit() {
  // 先把 300ms 窗口内还没落账的改动提交成一步，再撤——否则那笔改动被丢弃且多退一步
  clearTimeout(_histTimer);
  _commitHist();
  if (_histPos > 0) { _histPos--; _restore(_hist[_histPos]); }
}
function redoEdit() { if (_histPos < _hist.length - 1) { _histPos++; _restore(_hist[_histPos]); } }
function _updateUndoBtns() {
  const u = document.getElementById('undo-btn'), r = document.getElementById('redo-btn');
  if (u) u.disabled = _histPos <= 0;
  if (r) r.disabled = _histPos >= _hist.length - 1;
}
document.addEventListener('keydown', e => {
  // ⌘S 保存（输入框内也生效——保存不区分焦点位置）
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    saveTemplate();
    return;
  }
  if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z') return;
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA') return;  // 输入框走系统自带撤销
  e.preventDefault();
  if (e.shiftKey) redoEdit(); else undoEdit();
});

// 把当前模板绑给下拉里选中的那个项目。
//
// 绑定必须是一次明确的点击，不能让下拉本身承担——那个下拉的唯一职责是"换个剧名
// 看看 {剧名} 替换出来长什么样"，有人切着切着只是想看长标题的排版，
// 切一下就改了项目配置属于误伤。
//
// 按钮旁边写清楚这个项目当前绑的是哪个模板：不写的话，点下去会覆盖掉什么是不知道的。
function _curSampleProject() {
  const sel = document.getElementById('sample-sel');
  if (!sel || !sel.value) return null;
  return sampleProjects.find(x => String(x.id) === sel.value) || null;
}

function renderBindBtn() {
  const btn = document.getElementById('bind-btn');
  const note = document.getElementById('bind-note');
  if (!btn) return;
  const p = _curSampleProject();
  if (!p) { btn.style.display = 'none'; note.textContent = ''; return; }
  btn.style.display = '';
  const boundHere = p.default_template_id === TID;
  const boundElse = p.default_template_id && p.default_template_id !== TID;
  btn.textContent = boundHere ? '取消用于该项目' : '用于该项目';
  // 一直保留 btn-secondary：摘掉只剩 .btn，边框是透明的，看着像没渲染完。
  // 已绑定用 on 类点亮，跟别处的开关按钮同一套。
  btn.classList.toggle('on', boundHere);
  btn.title = boundHere
    ? `《${p.title}》导出时会自动选中这个模板，点一下取消`
    : `把这个模板设成《${p.title}》导出时的默认选择`;
  if (boundElse) {
    const other = sampleTemplates.find(t => t.id === p.default_template_id);
    note.textContent = `当前是「${other ? other.name : '另一个模板'}」，点击会替换`;
  } else {
    note.textContent = '';
  }
}

let sampleTemplates = [];   // 只为把项目绑的模板 id 显示成名字

async function bindTemplateToProject() {
  const p = _curSampleProject();
  if (!p) return;
  const on = p.default_template_id !== TID;
  const btn = document.getElementById('bind-btn');
  btn.disabled = true;
  try {
    await apiFetch(`/admake/projects/${p.id}`, {
      method: 'PUT',
      body: JSON.stringify({ default_template_id: on ? TID : 0 }),
    });
    // 后端把 0 当成"清空"（见 update_project），这里跟着把本地也置空
    p.default_template_id = on ? TID : null;
    renderBindBtn();
    toast(on ? `已设为《${p.title}》的模板，导出时自动选中` : `已取消《${p.title}》的模板绑定`,
          'success', 3500);
  } catch (e) {
    toast('设置失败：' + e.message, 'error', 6000);
  } finally {
    btn.disabled = false;
  }
}

function projVars() {
  const sel = document.getElementById('sample-sel');
  const p = sampleProjects.find(x => String(x.id) === sel.value) || sampleProjects[0];
  return p
    ? { 剧名: p.title || '剧名', 署名: p.editor_alias || '署名', 平台: p.target_platform || '平台' }
    : { 剧名: '示例剧名', 署名: '署名', 平台: '平台' };
}
function resolveVars(s) {
  const v = projVars();
  return String(s || '').replace(/\{剧名\}/g, v.剧名).replace(/\{署名\}/g, v.署名).replace(/\{平台\}/g, v.平台);
}

// 素材导入进度：就地显示在对应的槽位/区块上，不弹遮罩——导入的同时还要能摆别的元素。
// 一次只能选一个文件（input 是单选），所以一个变量就够。

// 拿不到百分比，条改成来回滑的不确定态，如实说"正在处理"，不编一个假数字。
let _uploading = null;   // {kind:'intro'|'outro'|'png'|'mov', name, phase, pct}

function uploadBarHtml() {
  if (!_uploading) return '';
  const indet = _uploading.phase !== 'uploading';
  const pct = indet ? 100 : _uploading.pct;
  const text = indet ? '正在处理素材…' : `上传中 ${_uploading.pct}%`;
  return `<div class="up-row">
    <div class="up-name">${esc(_uploading.name)}</div>
    <div class="up-bar ${indet ? 'indet' : ''}"><i style="width:${pct}%"></i></div>
    <div class="up-stage">${text}</div></div>`;
}
function showUploadProgress(kind, fileName) {
  _uploading = { kind, name: fileName, phase: 'uploading', pct: 0 };
  renderConfig();
}
function updateUploadProgress(phase, pct) {
  if (!_uploading) return;
  _uploading.phase = phase;
  if (phase === 'uploading') _uploading.pct = pct;
  // 只重画进度那一块，不整栏重建——重建会打断输入焦点，也会让动画从头开始
  const row = document.querySelector('.up-row');
  if (!row) { renderConfig(); return; }
  const indet = phase !== 'uploading';
  const bar = row.querySelector('.up-bar');
  bar.classList.toggle('indet', indet);
  bar.querySelector('i').style.width = (indet ? 100 : pct) + '%';
  row.querySelector('.up-stage').textContent = indet ? '正在处理素材…' : `上传中 ${pct}%`;
}
function hideUploadProgress() {
  _uploading = null;
  renderConfig();
}

function slotHtml(kind, label) {
  if (_uploading && _uploading.kind === kind) {
    return `<div class="slot loading">${uploadBarHtml()}</div>`;
  }
  const a = cfg[kind];
  if (a && a.asset) {
    return `<div class="slot filled">
      <div class="s-body"><div class="s-main">${label} · ${esc(a.name || a.asset)}</div>
      <div class="s-sub"><span class="ok">✓</span> ${a.duration ? a.duration + 's' : '已导入'}</div></div>
      <span class="s-x" onclick="removeClip('${kind}')">✕</span></div>`;
  }
  return `<div class="slot" onclick="pickAsset('${kind}')"><div class="s-ic">＋</div><div class="s-main">${label}（上传 mp4）</div></div>`;
}

function kindOf(id) { if (cfg.texts.some(x => x.id === id)) return 't'; if (cfg.pngs.some(x => x.id === id)) return 'p'; if (cfg.dyns.some(x => x.id === id)) return 'd'; return null; }

// ── 渲染：预览画布 ──
// 后端导出字号（px，720 宽成片上）——与 postprocess.py::_FONT_SIZES 保持一致
const FONT_SIZE_720 = {"宋体":66,"黑体":58,"圆润体":58,"Anton":68,"Bebas":74,"Poppins":56,
                       "Alfa Slab":56,"Bangers":66,"Lobster":70,"Pacifico":62,"Playfair":62};
const PREVIEW_RATIO = 300 / 720;  // 画布 300px 宽 : 成片 720px 宽
const MAX_TEXT_W = 300 * 0.9;     // 文字安全宽度（画布 90%）——与后端 _MAX_TEXT_W(648/720) 同比例

// 文字超宽处理，与后端 postprocess._fit_text 同一套规则：先缩字号(到 70%)，
// 再逐档折行(两行到 50%、三行到 40%)，仍超宽截断加省略号。返回 {lines:[...], fs}
const _measureCtx = document.createElement('canvas').getContext('2d');
function _lineW(s, fs, fam) { _measureCtx.font = `800 ${fs}px ${fam}`; return _measureCtx.measureText(s).width; }

function setPeriodMode(v) { setF('period', v === '前 N 秒' ? '前 5 秒' : v); }
function setPeriodN(v) {
  const n = Math.max(1, Math.min(600, Math.round(+v) || 5));
  setF('period', `前 ${n} 秒`);
}
function setTrans(v) { cfg.transition = v; renderConfig(); _pushHist(); }
function changeFrame() {
  frameIdx = document.getElementById('frame-sel').selectedIndex;
  // 片头/片尾 = 贴片画面，叠加内容整套只读：清选中、左栏叠加区置灰（.clips-mode）
  if (frameIdx !== 1) selected = null;
  document.querySelector('.col-config').classList.toggle('clips-mode', frameIdx !== 1);
  _bindClipsModeHint();
  // 切过去的当下就说清楚左栏为什么灰了。不说的话用户只看到一片点不动的区域，
  // 得自己猜是坏了还是被禁了。
  if (frameIdx !== 1) toast('片头和片尾是整段贴片画面，文字和贴纸只在中段生效', 'info', 3500);
  renderPreview(); renderConfig(); renderProp();
}
function toggleGuide() { document.getElementById('guide').classList.toggle('on', document.getElementById('guide-cb').checked); }

// ── 素材上传 ──
function pickAsset(kind) {
  if ((kind === 'png' || kind === 'mov') && frameIdx !== 1) { toast('切回「中段」再编辑贴纸', 'error'); return; }
  if (kind === 'png' && cfg.pngs.length >= STICKER_MAX) { toast(`静态贴纸最多 ${STICKER_MAX} 张`, 'error'); return; }
  if (kind === 'mov' && cfg.dyns.length >= STICKER_MAX) { toast(`动态贴纸最多 ${STICKER_MAX} 张`, 'error'); return; }
  const inp = document.getElementById('asset-input');
  inp.accept = kind === 'png' ? 'image/png' : (kind === 'mov' ? 'video/quicktime,.mov' : 'video/mp4,video/quicktime');
  // intro/outro 是槽位，素材类型都属 clip（视频、不要求透明）；png/mov 类型即槽位
  const uploadKind = (kind === 'intro' || kind === 'outro') ? 'clip' : kind;
  inp.onchange = async () => {
    const file = inp.files[0]; inp.value = '';
    if (!file) return;
    showUploadProgress(kind, file.name);
    try {
      const meta = await apiUploadAsset(uploadKind, file, updateUploadProgress);
      if (kind === 'intro' || kind === 'outro') {
        cfg[kind] = { asset: meta.asset, name: meta.orig_name || meta.asset, duration: meta.duration };
      } else if (kind === 'png') {
        // 初始缩放自适应：大贴纸先缩进画布 90% 内（720×1280 的 648×1152），要多大再手动拉
        const fitScale = Math.min(1, 648 / (meta.width || 1), 1152 / (meta.height || 1));
        const id = nid('p'); cfg.pngs.push({ id, asset: meta.asset, name: meta.orig_name || meta.asset, x: 80, y: 12, scale: +fitScale.toFixed(2), rot: 0, flip: false, period: '全程' }); selected = id;
      } else if (kind === 'mov') {
        const id = nid('d');
        cfg.dyns.push({ id, asset: meta.asset, name: meta.orig_name || meta.asset,
          preview: meta.preview, preview_kind: meta.preview_kind,
          x: 50, y: 50, scale: 1, rot: 0, flip: false, period: '循环整段', w: meta.width, h: meta.height });
        selected = id;
      }
      hideUploadProgress();
      toast('素材已导入', 'success');
      renderAll();
    } catch (e) {
      hideUploadProgress();
      toast('导入失败：' + e.message, 'error', 6000);
    }
  };
  inp.click();
}

// ── 保存 ──
async function saveTemplate() {
  if (_loadFailed) { toast('模板载入失败，保存已禁用（防止把线上模板覆盖成空的），请返回重进', 'error', 6000); return false; }
  const name = document.getElementById('tpl-name').value.trim();
  if (!name) { toast('请填写模板名称', 'error'); return false; }
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '保存中…';
  try {
    await apiFetch(`/admake/templates/${TID}`, { method: 'PUT', body: JSON.stringify({ name, config: cfg }) });
    _savedSnap = _snap();  // 保存成功后更新基线，返回不再拦
    _updateDirtyUI();
    toast('模板已保存', 'success');
    return true;
  } catch (e) { toast('保存失败：' + e.message, 'error'); return false; }
  finally { btn.disabled = false; btn.textContent = '保存模板'; }
}
function toggleSaveMenu(e) {
  e.stopPropagation();
  document.getElementById('save-menu').classList.toggle('hidden');
}
document.addEventListener('click', () => document.getElementById('save-menu')?.classList.add('hidden'));
let _shipBusy = false;  // 分享/副本共用的飞行锁：双击会打出两份不一致的包/多余副本
async function saveAndDuplicate() {
  document.getElementById('save-menu').classList.add('hidden');
  if (_shipBusy) return;
  _shipBusy = true;
  try {
    if (!await saveTemplate()) return;  // 先落盘，副本才是屏幕上这版
    const copy = await apiFetch(`/admake/templates/${TID}/duplicate`, { method: 'POST' });
    toast(`已创建副本「${copy.name}」，在模板库里可打开`, 'success');
  } catch (e) { toast('创建副本失败：' + e.message, 'error'); }
  finally { _shipBusy = false; }
}
async function exportShare() {
  if (_shipBusy) return;
  _shipBusy = true;
  // 模板包动辄两三百兆（一段片头就一百多兆），后端打包加传输落盘要一两秒，
  // 按钮不给状态的话这段时间就是「点了没动静」，人会以为没点上又点一次。
  const btn = document.getElementById('btn-export-share');
  const label = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.textContent = '打包中…'; }
  try { await _exportShareInner(); }
  finally {
    _shipBusy = false;
    if (btn) { btn.disabled = false; btn.innerHTML = label; }
  }
}
async function _exportShareInner() {
  // 先保存再打包：分享出去的必须是屏幕上这版，而不是上次保存的旧版
  if (!await saveTemplate()) return;
  try {
    const res = await fetch(`${API}/admake/templates/${TID}/package`, {
      headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {},
    });
    if (!res.ok) throw new Error(await res.text().catch(() => res.statusText));
    const blob = await res.blob();
    const name = document.getElementById('tpl-name').value.trim() || 'template';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${name}.skytpl`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('已导出模板包', 'success');
  } catch (e) { toast('导出失败：' + e.message, 'error'); }
}
function goList() {
  // 有未保存改动先弹自绘确认框，主按钮引导「保存并返回」——
  // 原生 confirm 的高亮键是"确定丢弃"，等于把丢版式做成默认动作，被用户否掉
  if (_savedSnap && _snap() !== _savedSnap) { showLeaveModal(); return; }
  location.href = 'index.html?view=templates' + _KQ('&');  // 回到成片模板 tab，不落到我的项目
}
let _leaveTarget = '';
// 外部脚本（右侧任务浮窗）发起的跳转先过一遍未保存确认。拦下返回 true，
// 之后去哪儿由弹窗上的按钮决定。
window.__guardLeave = (href) => {
  if (!(_savedSnap && _snap() !== _savedSnap)) return false;
  _leaveTarget = href;
  showLeaveModal();
  return true;
};
function _gotoList() { location.href = _leaveTarget || ('index.html?view=templates' + _KQ('&')); }
function showLeaveModal() {
  document.getElementById('leave-modal').classList.remove('hidden');
  document.getElementById('leave-save-btn').focus();
}
function hideLeaveModal() {
  document.getElementById('leave-modal').classList.add('hidden');
  _leaveTarget = '';   // 取消之后再点返回按钮，不能跑去浮窗那次的目标页
}
async function leaveWithSave() {
  const b = document.getElementById('leave-save-btn');
  b.disabled = true;
  const ok = await saveTemplate();   // 失败时 toast 已说明原因，留在页内
  b.disabled = false;
  if (ok) _gotoList(); else hideLeaveModal();
}

// ── Utils ──
function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
// 深色胶囊＋图标圆点：浅色界面上一眼能认出是临时浮层，不会被当成顶栏的一部分
const TOAST_ICON = {
  success: '<path d="M4 12l6 6L20 6"/>',
  error:   '<path d="M6 6l12 12M18 6L6 18"/>',
  info:    '<path d="M12 8v5M12 16.5v.5"/>',
};

function toast(msg, type = 'info', ms = 3200) {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  const dot = document.createElement('span');
  dot.className = 'toast-dot';
  dot.innerHTML = `<svg viewBox="0 0 24 24">${TOAST_ICON[type] || TOAST_ICON.info}</svg>`;
  const text = document.createElement('span');
  text.textContent = msg;          // 文本走 textContent，消息里含 < > 也不会被当标签解析
  el.append(dot, text);
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), ms + 400);
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const lm = document.getElementById('leave-modal');
  if (!lm.classList.contains('hidden')) { hideLeaveModal(); return; }  // 弹窗开着时 Esc 只关弹窗
  selected = null; renderAll();
});

// 提示气泡：fixed 定位跟随图标（垂直居中、右侧 10px），上下钳在视口内
const _tipPop = document.createElement('div');
_tipPop.id = 'tip-pop';
document.body.appendChild(_tipPop);
document.addEventListener('mouseover', (e) => {
  const ic = e.target.closest('.info-ic');
  if (!ic || !ic.dataset.tip) { _tipPop.style.display = 'none'; return; }
  _tipPop.textContent = ic.dataset.tip;
  _tipPop.style.display = 'block';
  const r = ic.getBoundingClientRect();
  _tipPop.style.left = `${r.right + 10}px`;
  const h = _tipPop.offsetHeight;
  const top = Math.max(8, Math.min(r.top + r.height / 2 - h / 2, window.innerHeight - h - 8));
  _tipPop.style.top = `${top}px`;
});
document.addEventListener('scroll', () => { _tipPop.style.display = 'none'; }, true);

// ── 液态玻璃 ────────────────────────────────────────────────────────────────
// 顶栏是为了跟另外两页长得一样；两个列头才是真有内容从底下滚过去的地方。
function initGlass() {
  if (window.SkyUI) SkyUI.layoutSegs();
  if (!window.LiquidLens) return;
  LiquidLens.setJellyGain(2);
  // 定位线浓度只给一半，理由同编辑器：让玻璃有边可折，不是让人去读线
  LiquidLens.mountBackdrop({ ink: .06, tint: false });
  LiquidLens.glass('.topbar', { band: 5, sat: 140 });
  // 工作面只给一点点，理由同编辑器
  LiquidLens.glass('.col', { band: 5, lens: false });
  document.querySelectorAll('.btn').forEach(b =>
    LiquidLens.bindJelly(b, { amp: 1.2, freq: 3.6, dur: 520 }));
  // 衔接转场的三个选项：它们是 <label> 不是 .btn，上面那行按类名绑的时候漏掉了，
  // 点「快闪白」没有 Q 弹。参数跟按钮完全一致——同样是点一下就生效的东西，手感不该有两套。
  // 弹的是 label 不是滑块：滑块靠 transform:translate 定位，jelly 会把 transform 整个覆写掉。
  document.querySelectorAll('#seg-trans label').forEach(l =>
    LiquidLens.bindJelly(l, { amp: 1.2, freq: 3.6, dur: 520 }));
  const leave = document.getElementById('leave-modal');
  if (leave) {
    LiquidLens.glass(leave.querySelector('.leave-glass'),
      { band: 6, sat: 150, bright: 106, rim: false });
    new MutationObserver(() => {
      if (!leave.classList.contains('hidden')) LiquidLens.refresh();
    }).observe(leave, { attributeFilter: ['class'] });
  }

}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(initGlass);
else window.addEventListener('load', initGlass);

init();
</script>
<script src="task-float.js"></script>
