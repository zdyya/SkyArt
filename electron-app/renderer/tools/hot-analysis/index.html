/* ── 右栏：模板草稿 ── */
/* 段没有存缩略图。拿 video 定位到段起点当封面：#t= 让浏览器只解到那一帧，
   metadata 预载不会把整条片子拖下来。muted+playsinline 是移动端浏览器的要求。 */
function 段封面(s, 片源){
  if(!片源) return '<img alt="">';
  var t = Math.max(0.1, (Number(s.起) || 0) + 0.5);
  return '<video src="' + esc(片源) + '#t=' + t.toFixed(1) + '" preload="metadata" muted playsinline></video>';
}

var 主角说法 = {'动手':'施加方', '挨打':'承受方', '都不是':'都不是'};
function 主角词(v){ return 主角说法[v] || v || '都不是'; }

var 严 = '标准';        // 精简／标准／完整
var 展开着 = {};        // 格序号 → true

/* 每格写哪些条件，由严格程度决定。
   与题材绑定的三项（经典桥段、旁观者、身份差距）只有严格档才写，
   跨剧套用时它们最容易把候选卡死。 */
function 尺度上限(s){
  var lv = Number(s.段的尺度档) || 0;
  return 严 === '精简' ? Math.max(lv, 3) : (严 === '标准' ? Math.max(lv, 2) : lv);
}
/* 每条除了给人读的文案，还带上写进模板的字段名和值——模板存到后端要的是
   结构化条件（见 demo/契约.md），不是这句中文。两者在这里一次产出，不做反向解析。
   块＝内容条件还是结构条件，k＝字段名，v＝值。 */
function 条件表(s, 末){
  var 标准 = 严 !== '精简', 完整 = 严 === '完整';
  var out = [
    {t:'段落类型为' + s.这段算哪种戏, 默:true,
     块:'内容条件', k:'最强的一刻属于哪一类', v:[s.这段算哪种戏]},
    {t:'尺度档不超过 ' + 尺度上限(s), 默:true,
     块:'内容条件', k:'尺度档上限', v:尺度上限(s)},
  ];
  out.push({t:'主角角色为' + 主角词(s.主角是动手还是挨打), 默:标准,
            块:'内容条件', k:'主角在这一刻是', v:[s.主角是动手还是挨打 || '都不是']});
  if((s.本能刺激 || []).length)
    out.push({t:'本能刺激含' + s.本能刺激.join('或'), 默:标准,
              块:'内容条件', k:'本能刺激', v:s.本能刺激.slice()});
  var 峰 = Number(s.最强的一刻在第几秒) || 0, 位 = (峰 - s.起) / (s.段时长 || 1);
  if(位 >= 0 && 位 <= 1){
    if(位 < 0.25) out.push({t:'最强的一刻位于前四分之一', 默:标准,
                            块:'结构条件', k:'最强的一刻位置', v:'前四分之一'});
    else if(位 > 0.75) out.push({t:'最强的一刻位于后四分之一', 默:标准,
                                 块:'结构条件', k:'最强的一刻位置', v:'后四分之一'});
  }
  if(s.哪种经典桥段 && s.哪种经典桥段 !== '都不是')
    out.push({t:'经典桥段为' + s.哪种经典桥段, 默:完整,
              块:'内容条件', k:'高转化场景', v:[s.哪种经典桥段]});
  out.push({t:s.有没有旁人在看 === '有' ? '有旁观者' : '无旁观者', 默:完整,
            块:'内容条件', k:'有没有旁人在看', v:s.有没有旁人在看 === '有' ? '有' : '无'});
  out.push({t:s.有没有身份差距 === '有' ? '有身份差距' : '无身份差距', 默:完整,
            块:'内容条件', k:'阶层落差', v:s.有没有身份差距 === '有' ? '有' : '无'});
  if(末 && s.结尾留没留悬念)
    out.push({t:s.结尾留没留悬念 === '留了' ? '结尾留悬念' : '结尾不留悬念', 默:标准,
              块:'结构条件', k:'结尾留没留悬念', v:s.结尾留没留悬念});
  return out;
}
function 开着(id, j, 默){ var k = 严 + '|' + id + '|' + j; return 手改[k] === undefined ? 默 : 手改[k]; }

function 换档(v){ 严 = v; 展开着 = {}; 画草稿(); }
function 改过多少(){
  return Object.keys(手改).filter(function(k){ return k.indexOf(严 + '|') === 0; }).length;
}
function 重置条件(){
  var n = 改过多少();
  if(!n){ 提示('本档的条件就是默认值，没有改动'); return; }
  Object.keys(手改).forEach(function(k){ if(k.indexOf(严 + '|') === 0) delete 手改[k]; });
  画草稿(); 提示('已恢复' + 严 + '档的默认条件，撤销了 ' + n + ' 处改动');
}
$('lvl').querySelectorAll('[data-l]').forEach(function(el){
  el.onclick = function(){
    $('lvl').querySelectorAll('[data-l]').forEach(function(x){ x.classList.remove('on'); });
    el.classList.add('on'); 换档(el.dataset.l);
  };
});

function 画草稿(){
  var 段们 = 当前.段.filter(function(s){ return 勾[s.段ID]; });
  // 一段就是一格，格数和已选段数永远相等，只留后面那个
  $('d-s').textContent = '已选 ' + 段们.length + ' / ' + 当前.段.length + ' 段';
  if(!段们.length){
    $('d-body').innerHTML = '<div class="empty">未勾选段</div>';
    $('d-name').value = '';
    $('d-save').disabled = true; $('d-save').style.opacity = .45;
    return;
  }
  $('d-save').disabled = false; $('d-save').style.opacity = 1;
  var 整条 = 段们.length >= 4;
  // 自动名带上写入档，换档时跟着变；撞上库里已有的就往后排号，
  // 否则刚进页面就顶着一条"会覆盖"的红字
  if(名自动 || !$('d-name').value){
    var 基 = 当前.编号 + '_' + 严, 拟 = 基, k = 2;
    while(有同名(拟)){ 拟 = 基 + '（' + k + '）'; k++; }
    $('d-name').value = 拟;
    查重();
  }
  var 条数 = 0;
  $('btn-reset').disabled = !改过多少();
  $('d-body').innerHTML = 段们.map(function(s, i){
    var 末 = i === 段们.length - 1;
    var cs = 条件表(s, 末);
    var 位 = i === 0 ? '开场' : (末 ? '结尾' : '中段');
    var 尾 = {'动手':' · 主角施加方','挨打':' · 主角承受方'}[s.主角是动手还是挨打] || '';
    var 开 = cs.filter(function(c, j){ return 开着(s.段ID, j, c.默); }).length;
    条数 += 开;
    return '<div class="gcell"><div class="gh' + (展开着[i] ? ' open' : '') + '" data-g="' + i + '"><span class="no">' + (i+1) + '</span>' +
      段封面(s, 当前.片源) +
      '<span class="gn">' + 位 + ' · ' + esc(s.这段算哪种戏) + esc(尾) + '</span>' +
      '<span class="gd" title="原片这一段的长度。出片时每段多长由目标时长现算，模板不带时长条件">' +
        n1(s.段时长) + ' 秒</span>' +
      '<span class="gx">条件 ' + 开 + '</span>' + 箭头 + '</div>' +
      '<div class="gc' + (展开着[i] ? '' : ' hide') + '">' + cs.map(function(c, j){
        var on = 开着(s.段ID, j, c.默);
        return '<button data-k="' + s.段ID + '|' + j + '" class="' + (on ? 'on' : '') + '">' +
          esc(c.t) + '<span class="x">' + (on ? '×' : '＋') + '</span></button>';
      }).join('') + '</div></div>';
  }).join('') +
  '';
  $('d-body').querySelectorAll('[data-g]').forEach(function(el){
    el.onclick = function(){
      var i = el.dataset.g;
      if(展开着[i]) delete 展开着[i]; else 展开着[i] = true;
      画草稿();
    };
  });
  $('d-body').querySelectorAll('[data-k]').forEach(function(el){
    el.onclick = function(e){
      e.stopPropagation();
      var a = el.dataset.k.split('|');
      手改[严 + '|' + el.dataset.k] = !开着(a[0], Number(a[1]), el.classList.contains('on'));
      画草稿();
    };
  });
}
/* ── 模板库 ── */
var 模板库 = [];
function 建模板(名, 段们, 来源, 来自){
  return {名:名, 来源:来源 || '爆款模板', 来自:来自 || 当前.编号, 写入档:严,
    种类:(段们.length >= 4 ? '整条' : '片段'),
    格:段们.map(function(s, i){
      var 末 = i === 段们.length - 1;
      var 位 = i === 0 ? '开场' : (末 ? '结尾' : '中段');
      var 尾 = {'动手':' · 主角施加方','挨打':' · 主角承受方'}[s.主角是动手还是挨打] || '';
      var 选中 = 条件表(s, 末).filter(function(c, j){ return 开着(s.段ID, j, c.默); });
      var 内容 = {}, 结构 = {};
      选中.forEach(function(c){
        if(!c.k) return;
        (c.块 === '结构条件' ? 结构 : 内容)[c.k] = c.v;
      });
      return {序:i + 1, 格名:位 + ' · ' + s.这段算哪种戏 + 尾, 段时长:s.段时长, 来自:s.段ID,
        锁位置: i === 0 ? '第一格' : (末 ? '最后一格' : '不锁'), 取几段:1,
        内容条件:内容, 结构条件:结构,
        条件:选中.map(function(c){ return c.t; })};
    })};
}
function 有同名(名){ return 模板库.some(function(t){ return t.名 === 名; }); }
var 名自动 = true;                 // 名字还是自动生成的，用户一旦自己改过就置 false
var 刚存 = '';                     // 刚存进库的那个名字，重名提示对它不算警告
function 改名(){ 名自动 = false; 刚存 = ''; 查重(); }
function 查重(){
  var 名 = $('d-name').value.trim();
  var 重 = 有同名(名), 自己 = 重 && 名 === 刚存;
  $('d-name').classList.toggle('bad', 重 && !自己);
  $('d-warn').classList.toggle('hide', !重);
  $('d-warn').classList.toggle('calm', 自己);
  $('d-warn').textContent = !重 ? ''
    : (自己 ? '这个模板刚存进库，再点一次会覆盖它。' : '模板库里已有同名模板，存入会覆盖它。');
  $('d-save').textContent = 重 ? '覆盖同名模板' : '存入模板库';
}
async function 存模板(){
  var 名 = ($('d-name').value || '').trim();
  if(!名){ 提示('请先填模板名称'); return; }
  var 段们 = 当前.段.filter(function(s){ return 勾[s.段ID]; });
  if(!段们.length){ 提示('先在上面的段序里勾几段'); return; }
  var t = 建模板(名, 段们);
  var 旧 = 模板库.find(function(x){ return x.名 === 名; });
  try {
    if(旧 && 旧.id) await api('/admake/cut-templates/' + 旧.id, {method:'DELETE'});
    await api('/admake/cut-templates', {method:'POST', body:JSON.stringify({
      name: 名, source: '爆款模板',
      source_note: '拆自素材 ' + (当前.编号 || '') + '，' + 严 + '档写入',
      kind: t.种类, slots: t.格,
    })});
  } catch(e){ 提示('存不进去：' + e.message); return; }
  提示((旧 ? '已覆盖同名模板：' : '已存入模板库：') + 名 + '（' + t.格.length + ' 格）');
  刚存 = 名;
  await 拉模板库();
  查重();
}

/* 模板库存在后端，跟「素材制作 2.0」导出面板里选的是同一份。
   放在这一页的内存里，剪的时候就选不到。 */
async function 拉模板库(){
  try {
    var ts = await api('/admake/cut-templates');
    模板库 = ts.map(function(t){
      return {id:t.id, 名:t.name, 来源:t.source, 来自:(t.source_note || '').replace(/^拆自素材 /, '').split('，')[0],
              种类:t.kind, 内置:t.builtin,
              格:(t.slots || []).map(function(g){
                var c = g.内容条件 || {}, q = g.结构条件 || {};
                var 句 = [];
                if(c['最强的一刻属于哪一类']) 句.push('段落类型为' + [].concat(c['最强的一刻属于哪一类']).join('或'));
                if(c['尺度档上限'] != null) 句.push('尺度档不超过 ' + c['尺度档上限']);
                if(c['主角在这一刻是']) 句.push('主角角色为' + 主角词([].concat(c['主角在这一刻是'])[0]));
                if(c['本能刺激']) 句.push('本能刺激含' + [].concat(c['本能刺激']).join('或'));
                if(c['高转化场景']) 句.push('经典桥段为' + [].concat(c['高转化场景']).join('或'));
                if(c['有没有旁人在看']) 句.push(c['有没有旁人在看'] === '有' ? '有旁观者' : '无旁观者');
                if(c['阶层落差']) 句.push(c['阶层落差'] === '有' ? '有身份差距' : '无身份差距');
                if(q['最强的一刻位置']) 句.push('最强的一刻位于' + q['最强的一刻位置']);
                if(q['结尾留没留悬念']) 句.push(q['结尾留没留悬念'] === '留了' ? '结尾留悬念' : '结尾不留悬念');
                return {序:g.序, 格名:g.格名 || ('第' + g.序 + '格'), 段时长:g.段时长 || 0,
                        来自:g.来自 || '', 条件:句};
              })};
    });
  } catch(e){ 模板库 = []; }
  画库();
}
function 画库(){
  $('lib-n').textContent = 模板库.length;
  if(!模板库.length){ $('lib-body').innerHTML = '<div class="empty">模板库是空的</div>'; return; }
  $('lib-body').innerHTML = 模板库.map(function(t, i){
    return '<div class="lrow"><div class="lh' + (开库[i] ? ' open' : '') + '" data-l="' + i + '">' +
      箭头 +
      '<span class="ltag">' + esc(t.种类) + '</span>' +
      '<span class="ln">' + esc(t.名) + '</span>' +
      '<span class="lg">' + t.格.length + ' 格 · ' + esc(t.来源) + '</span>' +
      '<span class="lact">' +
        '<button class="ib" data-x="' + i + '" title="导出这一个模板">' + 下载图 + '</button>' +
        (待删 === i
          ? '<button class="ib warn" data-d="' + i + '">再点一次删除</button>'
          : '<button class="ib danger" data-d="' + i + '" title="删除这个模板">' + 删除图 + '</button>') +
      '</span></div>' +
      (开库[i] ? '<div class="lbody">' +
        (t.来自 ? '<div class="lfrom">来自素材 ' + esc(t.来自) + '</div>' : '') +
        t.格.map(function(g){
        return '<div class="lcell"><span class="n">' + g.序 + '</span><span>' + esc(g.格名) +
          '<span style="color:var(--text3)">　原片 ' + n1(g.段时长) + ' 秒</span>' +
          '<br><span style="color:var(--text3)">' + esc(g.条件.join('，')) + '</span></span></div>';
      }).join('') + '</div>' : '') + '</div>';
  }).join('');
  $('lib-body').querySelectorAll('[data-l]').forEach(function(el){
    el.onclick = function(){ var i = el.dataset.l;
      if(开库[i]) delete 开库[i]; else 开库[i] = true; 画库(); };
  });
  $('lib-body').querySelectorAll('[data-x]').forEach(function(el){
    el.onclick = function(e){ e.stopPropagation(); 下载([模板库[el.dataset.x]], 模板库[el.dataset.x].名); };
  });
  $('lib-body').querySelectorAll('[data-d]').forEach(function(el){
    el.onclick = function(e){ e.stopPropagation();
      var i = Number(el.dataset.d);
      if(待删 !== i){ 待删 = i; 画库(); clearTimeout(删计时);
        删计时 = setTimeout(function(){ 待删 = -1; 画库(); }, 4000); return; }
      var t = 模板库[i];
      if(t.内置){
        待删 = -1; 画库();
        提示('随包预置的模板不能删。自己存进来的可以删'); return;
      }
      api('/admake/cut-templates/' + t.id, {method:'DELETE'}).then(function(){
        待删 = -1; 开库 = {};
        提示('已删除模板：' + t.名);
        return 拉模板库();
      }).then(查重).catch(function(e){ 提示('删不掉：' + e.message); }); };
  });
}
var 开库 = {}, 待删 = -1, 删计时;
function 下载(列, 名){
  var b = new Blob([JSON.stringify(列, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 名 + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function 导出全部(){
  if(!模板库.length){ 提示('模板库是空的'); return; }
  下载(模板库, '模板库_' + 模板库.length + ' 个');
  提示('已导出 ' + 模板库.length + ' 个模板');
}
function 读入(e){
  var f = e.target.files && e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result); if(!Array.isArray(d)) d = [d];
      var n = 0;
      d.forEach(function(t){
        if(!t || !t.名 || !t.格) return;
        var 名 = t.名; var k = 2;
        while(有同名(名)){ 名 = t.名 + '（' + k + '）'; k++; }
        t.名 = 名; t.来源 = '导入'; 模板库.unshift(t); n++;
      });
      画库(); 查重(); 提示(n ? '已导入 ' + n + ' 个模板' : '文件里没有可用的模板');
    }catch(err){ 提示('这个文件不是模板 JSON'); }
  };
  r.readAsText(f); e.target.value = '';
}

/* 页签切换 */
$('tabs').querySelectorAll('[data-p]').forEach(function(el){
  el.onclick = function(){
    $('tabs').querySelectorAll('[data-p]').forEach(function(x){ x.classList.remove('on'); });
    el.classList.add('on');
    $('pane-draft').classList.toggle('hide', el.dataset.p !== 'draft');
    $('pane-lib').classList.toggle('hide', el.dataset.p !== 'lib');
    $('d-s').style.display = el.dataset.p === 'draft' ? '' : 'none';
  };
});

/* ── 播放器：不切片，在原素材上播这一段的区间 ── */
var V = $('seg-v');
function 装片(s){
  var m = 素材[s.素材] || 当前;
  if(V.getAttribute('src') !== m.片源){
    V.setAttribute('src', m.片源); V.load();
  }
  跳到(s.起 || 0);
  改播放字(); 走时();
}
function 跳到(秒){
  var 走 = function(){ try{ V.currentTime = 秒; }catch(e){} 走时(); };
  if(V.readyState >= 1) 走(); else V.addEventListener('loadedmetadata', 走, {once:true});
}
function 播放(){ if(V.paused){ if(V.currentTime >= (当前段.止 || 0) - 0.2) 跳到(当前段.起 || 0); V.play(); } else V.pause(); }
function 改播放字(){ $('v-play').textContent = V.paused ? '播放' : '暂停'; }
function 回段首(){ 跳到(当前段.起 || 0); }
function 走时(){
  var s = 当前段, 起 = s.起 || 0, 长 = s.段时长 || 1;
  var t = V.currentTime || 0;
  if(!V.paused && t > (s.止 || 0)){ V.pause(); 跳到(s.止 || 0); return; }   // 播到段尾就停
  var 比 = Math.min(Math.max((t - 起) / 长, 0), 1);
  $('v-fill').style.width = (比 * 100).toFixed(2) + '%';
  $('v-knob').style.left = (比 * 100).toFixed(2) + '%';
  $('v-time').textContent = mmss(Math.max(t - 起, 0)) + ' / ' + mmss(长);
}

/* 进度条：点一下定位，按住拖动 */
function 拖进度(x){
  var r = $('v-prog').getBoundingClientRect();
  var 比 = Math.min(Math.max((x - r.left) / r.width, 0), 1);
  跳到((当前段.起 || 0) + (当前段.段时长 || 0) * 比);
}
var 正在拖 = false;
$('v-prog').addEventListener('mousedown', function(e){
  正在拖 = true; V.pause(); 拖进度(e.clientX); e.preventDefault();
});
document.addEventListener('mousemove', function(e){ if(正在拖) 拖进度(e.clientX); });
document.addEventListener('mouseup', function(){ 正在拖 = false; });

/* 快捷键：空格播放暂停，左右各挪 5 秒 */
document.addEventListener('keydown', function(e){
  var t = e.target, 标签 = t && t.tagName;
  if(标签 === 'INPUT' || 标签 === 'TEXTAREA' || 标签 === 'SELECT') return;
  if(e.code === 'Space'){ e.preventDefault(); 播放(); return; }
  if(e.code === 'ArrowLeft' || e.code === 'ArrowRight'){
    e.preventDefault();
    var 步 = e.code === 'ArrowLeft' ? -5 : 5;
    var 秒 = Math.min(Math.max((V.currentTime || 0) + 步, 当前段.起 || 0), 当前段.止 || 0);
    跳到(秒);
  }
});

/* ── 上传：一次最多 5 条，排好队再逐条分析 ── */
var 最多 = 5, 最长 = 30 * 60;
var 待传 = [];
var 上移图 = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>';
var 下移图 = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
var 叉图 = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';

function 开上传(){
  待传 = [];
  画待传();
  $('up-modal').classList.add('visible');
}
function 关上传(){ $('up-modal').classList.remove('visible'); }

var 可传格式 = ['mp4', 'mov'];
function 量时长(f, 回){
  var u = URL.createObjectURL(f), v = document.createElement('video');
  v.preload = 'metadata';
  v.onloadedmetadata = function(){ 回(v.duration); URL.revokeObjectURL(u); };
  v.onerror = function(){ 回(null); URL.revokeObjectURL(u); };
  v.src = u;
}
function 选好文件(e){
  var fs = [].slice.call(e.target.files || []);
  e.target.value = '';
  if(!fs.length) return;
  var 挡格式 = [], 挡时长 = [], 挡条数 = 0;
  fs = fs.filter(function(f){
    var 后 = (f.name.split('.').pop() || '').toLowerCase();
    if(可传格式.indexOf(后) < 0){ 挡格式.push(f.name); return false; }
    return true;
  });
  var 余 = Math.max(最多 - 待传.length, 0);
  挡条数 = Math.max(fs.length - 余, 0);
  fs = fs.slice(0, 余);
  var 等 = fs.length;
  var 收 = function(){
    if(--等) return;
    画待传();
    报挡下的(挡格式, 挡时长, 挡条数);
  };
  if(!等){ 报挡下的(挡格式, 挡时长, 挡条数); return; }
  fs.forEach(function(f){
    量时长(f, function(d){
      if(d != null && d > 最长) 挡时长.push(f.名 || f.name);
      else 待传.push({名:f.name, 时长:d, file:f});   // 留住 File，上传要用它
      收();
    });
  });
}
function 报挡下的(挡格式, 挡时长, 挡条数){
  var 话 = [];
  if(挡格式.length) 话.push(挡格式.length === 1
    ? 挡格式[0] + ' 不是 mp4 或 mov，没有加进来'
    : 挡格式.length + ' 个文件不是 mp4 或 mov，没有加进来');
  if(挡时长.length) 话.push(挡时长.length === 1
    ? 挡时长[0] + ' 超过 30 分钟，没有加进来'
    : 挡时长.length + ' 个文件超过 30 分钟，没有加进来');
  if(挡条数) 话.push('一次最多 ' + 最多 + ' 条，多出来的 ' + 挡条数 + ' 个没有加进来');
  if(话.length) 提示(话.join('；'));
}
function 挪(i, 步){
  var j = i + 步;
  if(j < 0 || j >= 待传.length) return;
  var a = 待传[i]; 待传[i] = 待传[j]; 待传[j] = a;
  画待传();
}
function 删掉(i){
  var f = 待传.splice(i, 1)[0];
  画待传();
  提示('已从队列里删掉：' + f.名);
}
function 画待传(){
  $('up-list').innerHTML = 待传.map(function(f, i){
    return '<div class="uprow">' +
      '<span class="upix">' + (i + 1) + '</span>' +
      '<span class="upn" title="' + esc(f.名) + '">' + esc(f.名) + '</span>' +
      '<span class="updur">' + (f.时长 == null ? '读取中' : mmss(f.时长)) + '</span>' +
      '<span class="upact">' +
        '<button class="uib" onclick="挪(' + i + ',-1)" title="往前排"' + (i === 0 ? ' disabled' : '') + '>' + 上移图 + '</button>' +
        '<button class="uib" onclick="挪(' + i + ',1)" title="往后排"' + (i === 待传.length - 1 ? ' disabled' : '') + '>' + 下移图 + '</button>' +
        '<button class="uib danger" onclick="删掉(' + i + ')" title="从队列里删掉">' + 叉图 + '</button>' +
      '</span></div>';
  }).join('');
  var 有 = 待传.length > 0;
  $('up-go').disabled = !有;
  $('up-later').disabled = !有;
}

/* 一条一条传：每条建一个项目，传进去，合成它自己的那个 Part。 */
async function 收进列表(){
  if(!待传.length) return [];
  var 旧 = Object.keys(素材);
  $('up-go').disabled = true; $('up-later').disabled = true;
  var 失败 = [];
  for(var i = 0; i < 待传.length; i++){
    var f = 待传[i];
    if(!f.file) continue;
    var 名 = f.名.replace(/\.[^.]+$/, '').slice(0, 60) || ('素材' + (i + 1));
    try {
      var proj = await api('/admake/projects', {method:'POST', body:JSON.stringify(
        {title:名, project_kind:'hot', description:'已投放的爆款广告素材'})});
      var fd = new FormData();
      fd.append('files', f.file);
      var r = await fetch(API + '/admake/projects/' + proj.id + '/sources',
        {method:'POST', headers:{Authorization:'Bearer ' + TOKEN}, body:fd});
      if(!r.ok) throw new Error('上传失败 ' + r.status);
      // 爆款素材直接拿上传的原文件当片源，这一步只登记时长和路径，不转码
      await api('/admake/projects/' + proj.id + '/build-parts', {method:'POST'});
    } catch(e){ 失败.push(f.名 + '：' + e.message); }
  }
  待传 = [];
  关上传();
  await 装数据();
  var 新 = Object.keys(素材).filter(function(k){ return 旧.indexOf(k) < 0; });
  默认全勾(); 画全部(); 画面板(); 画当前();
  if(失败.length) 提示('有 ' + 失败.length + ' 条没传上：' + 失败[0]);
  return 新;
}
async function 跑分析(){
  var 得 = await 收进列表();
  if(!得.length) return;
  选素材(得[0]);
  得.forEach(开分析);
  提示('已提交 ' + 得.length + ' 条，拆段要几分钟，进度见右侧');
}
async function 稍后分析(){
  var 得 = await 收进列表();
  if(!得.length) return;
  选素材(得[0]);
  提示('已上传 ' + 得.length + ' 条，在素材列表里点开始分析');
}

var 提示计时;
function 提示(t){
  $('toast').textContent = t; $('toast').classList.add('show');
  clearTimeout(提示计时);
  提示计时 = setTimeout(function(){ $('toast').classList.remove('show'); }, 3000);
}

function 画全部(){
  var 好 = 状(当前.编号) === '已完成';
  $('three').classList.toggle('hide', !好);
  $('waitbox').classList.toggle('hide', 好);
  画当前();
  if(好){ 画段序(); 画字段(); 画草稿(); return; }
  画等待();
  $('seq-t').textContent = '段序';
  $('seq-s').textContent = '';
  $('lane').innerHTML = '<div class="empty">分析完成后，这里出现拆好的段</div>';
  $('mat-meta').textContent = '';
  勾 = {}; 画草稿();
  $('d-s').textContent = '';
}
function 画等待(){
  var e = 态[当前.编号] || {}, s = e.状态;
  var 没跑成 = (s === '分析失败' || s === '分析中断');
  $('seg-t').textContent = '段详情';
  $('seg-s').textContent = '';
  $('wait-t').textContent = s === '分析中' ? '正在分析这条素材'
    : s === '分析失败' ? '这条素材分析失败'
    : s === '分析中断' ? '这条素材的分析断了'
    : '这条素材还没分析';
  $('wait-s').textContent = s === '分析中' ? '分析在后台进行，可以先去看别的素材。'
    : s === '分析中断' ? '已经跑完的步骤有缓存，重新分析会接着往下跑。'
    : s === '分析失败' ? (e.原因 || '没跑通')
    : '';
  $('wait-bar').classList.toggle('hide', s !== '分析中');
  $('wait-fill').style.width = (e.进度 || 0) + '%';
  $('wait-go').classList.toggle('hide', s === '分析中');
  $('wait-go').textContent = 没跑成 ? '重新分析' : '开始分析';
}

/* 起步：没登录先回首页；拉数据、拉模板库，再画。 */
(async function 起(){
  if(!TOKEN){ location.href = '../../home.html'; return; }
  try {
    await 装数据();
  } catch(e){
    提示('连不上后端：' + e.message);
    return;
  }
  默认全勾(); 画全部(); 画面板();
  await 拉模板库();
  if(!D.素材.length) 开上传();     // 一条素材都没有，直接把上传弹窗摆出来
})();

</script>
